services:
  cinepilot:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      CORS_ORIGIN: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CINEPILOT_REQUIRE_LIVE_MCP: ${CINEPILOT_REQUIRE_LIVE_MCP:-false}
      MCP_CLICKHOUSE_URL: ${MCP_CLICKHOUSE_URL:-}
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports: ["8123:8123","9000:9000"]
    environment:
      CLICKHOUSE_DB: cinepilot
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  clickhouse_data:
